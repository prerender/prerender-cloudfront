Parameters:
  DeploymentName:
    Description: Unique name used to create OAC and cache policy.
    Type: String

  PrerenderToken:
    Type: String
    Description: Prerender.io token

Resources:

  LambdaEdgeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: logging
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource: "*"
                Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
  SetPrerenderHeader:
    Type: "AWS::Lambda::Function"
    Properties:
      Handler: "index.handler"
      Role:
        Fn::GetAtt:
          - "LambdaEdgeExecutionRole"
          - "Arn"
      Code:
        ZipFile:
          !Sub |
          'use strict';
          /* change the version number below whenever this code is modified */
          exports.handler = (event, context, callback) => {
              const request = event.Records[0].cf.request;
              const headers = request.headers;
              const user_agent = headers['user-agent'];
              const host = headers['host'];
              if (user_agent && host) {
                var prerender = /googlebot|adsbot\-google|Feedfetcher\-Google|bingbot|yandex|baiduspider|Facebot|facebookexternalhit|twitterbot|rogerbot|linkedinbot|embedly|quora link preview|showyoubot|outbrain|pinterest|slackbot|vkShare|W3C_Validator|redditbot|applebot|whatsapp|flipboard|tumblr|bitlybot|skypeuripreview|nuzzel|discordbot|google page speed|qwantify|pinterestbot|bitrix link preview|xing\-contenttabreceiver|chrome\-lighthouse|telegrambot|Perplexity|OAI-SearchBot|ChatGPT|GPTBot|ClaudeBot|Amazonbot|integration-test|iframely/i.test(user_agent[0].value);
                prerender = prerender || /_escaped_fragment_/.test(request.querystring);
                prerender = prerender && ! /\.(js|css|xml|less|png|jpg|jpeg|gif|pdf|doc|txt|ico|rss|zip|mp3|rar|exe|wmv|doc|avi|ppt|mpg|mpeg|tif|wav|mov|psd|ai|xls|mp4|m4a|swf|dat|dmg|iso|flv|m4v|torrent|ttf|woff|woff2|otf|svg|eot|webp|avif|webmanifest)$/i.test(request.uri);
                if (prerender) {
                  headers['x-prerender-token'] = [{ key: 'X-Prerender-Token', value: '${PrerenderToken}'}];
                  headers['x-prerender-host'] = [{ key: 'X-Prerender-Host', value: host[0].value}];
                  headers['x-prerender-int-type'] = [{ key: 'X-Prerender-Int-Type', value: 'cloudfront'}];
                  headers['x-prerender-int-version'] = [{ key: 'X-Prerender-Int-Version', value: '2.0.0'}];
                  headers['x-prerender-cachebuster'] = [{ key: 'X-Prerender-Cachebuster', value: Date.now().toString()}];
                  headers['x-query-string'] = [{ key: 'X-Query-String', value: request.querystring}];
                  headers['x-user-agent'] = [{ key: 'X-User-Agent', value: user_agent[0].value}];
                }
              }
              callback(null, request);
          };
      Runtime: "nodejs22.x"
  SetPrerenderHeaderVersion2:
    Type: "AWS::Lambda::Version"
    Properties:
      FunctionName:
        Ref: "SetPrerenderHeader"
      Description: "SetPrerenderHeader"
  RedirectToPrerender:
    Type: "AWS::Lambda::Function"
    Properties:
      Handler: "index.handler"
      Role:
        Fn::GetAtt:
          - "LambdaEdgeExecutionRole"
          - "Arn"
      Code:
        ZipFile: |
          'use strict';
          /* change the version number below whenever this code is modified */
          exports.handler = (event, context, callback) => {
               const request = event.Records[0].cf.request;
               if (request.headers['x-prerender-token'] && request.headers['x-prerender-host'] && request.headers['x-query-string']) {
                 const originalHost = request.headers['x-prerender-host'][0].value;
                 request.querystring = request.headers['x-query-string'][0].value;
                 request.headers['host'] = [{ key: 'host', value: 'service.prerender.io' }];
                 /* SetPrerenderHeader copied the true User-Agent into X-User-Agent in the
                    viewer-request event. CloudFront then builds the origin request, and in that
                    step it replaces User-Agent with the constant "Amazon CloudFront" unless the
                    cache policy or origin request policy forwards User-Agent. The custom header
                    is not touched. Copy it back here, in the origin-request event, so that
                    Prerender.io receives the crawler identity even when User-Agent is not
                    forwarded. User-Agent is not read-only in this event, so the write is legal:
                    https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-function-restrictions-all.html
                    The integration stays identifiable through X-Prerender-Int-Type and
                    X-Prerender-Int-Version. */
                 if (request.headers['x-user-agent']) {
                   request.headers['user-agent'] = [{ key: 'User-Agent', value: request.headers['x-user-agent'][0].value }];
                 }
                 request.origin = {
                     custom: {
                         domainName: 'service.prerender.io',
                         port: 443,
                         protocol: 'https',
                         readTimeout: 50,
                         keepaliveTimeout: 20,
                         customHeaders: {},
                         sslProtocols: ['TLSv1', 'TLSv1.1', 'TLSv1.2'],
                         path: '/https%3A%2F%2F' + originalHost
                     }
                 };
              }
              callback(null, request);
          };
      Runtime: "nodejs22.x"
  RedirectToPrerenderVersion3:
    Type: "AWS::Lambda::Version"
    Properties:
      FunctionName:
        Ref: "RedirectToPrerender"
      Description: "RedirectToPrerender"

  # Creates a new origin access control. The signing behavior "always" is the most common use case.
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-cloudfront-originaccesscontrol-originaccesscontrolconfig.html
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Ref DeploymentName
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          Compress: true
          # NOTE: we let cloudfront cache heavily the resurces of the SPA. Your deploy
          #       step will need to include an invalidation of the cloudfromt cache.
          #       The requests to prerender.io are NOT cached thanks to the X-Prerender-Cachebuster
          #       header.
          MinTTL: 31536000
          DefaultTTL: 31536000
          ForwardedValues:
            QueryString: true
            Headers:
              - "X-Prerender-Token"
              - "X-Prerender-Host"
              - "X-Prerender-Int-Type"
              - "X-Prerender-Int-Version"
              - "X-Prerender-Cachebuster"
              - "X-Query-String"
              - "User-Agent"
              - "X-User-Agent"
          TargetOriginId: thisS3Origin
          ViewerProtocolPolicy: allow-all
          LambdaFunctionAssociations:
            - EventType: viewer-request
              LambdaFunctionARN: !Join [ ":", [ !GetAtt [ SetPrerenderHeader, Arn ], !GetAtt [ SetPrerenderHeaderVersion2, Version ] ] ]
            - EventType: origin-request
              LambdaFunctionARN: !Join [ ":", [ !GetAtt [ RedirectToPrerender, Arn ], !GetAtt [ RedirectToPrerenderVersion3, Version ] ] ]
        Origins:
          - DomainName: !GetAtt Bucket.DomainName
            Id: thisS3Origin
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""

  # Creates a new S3 bucket with SSE and public access blocked.
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-s3-bucket.html
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Creates a bucket policy giving OAC read-only access to the S3 bucket.
  # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: 2008-10-17
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Action:
              - 's3:GetObject'
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution.Id}"

Outputs:
  CloudFrontDomain:
    Description: URL of CloudFront distribution.
    Value: !GetAtt CloudFrontDistribution.DomainName
